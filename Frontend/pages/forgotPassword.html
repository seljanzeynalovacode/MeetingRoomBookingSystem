<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="meta.title.forgotPassword">Şifrəni bərpa et — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <button type="button" class="floating-theme-toggle" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
  <button type="button" class="floating-theme-toggle floating-lang-toggle" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
  <div class="auth-shell">
    <div class="auth-form-col stacked">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetHub</span>
      </div>

      <div class="auth-center-area">
      <div class="auth-card text-center" style="max-width: 420px;">
        <div class="icon-orb"><i class="bi bi-key"></i></div>

        <h1 data-i18n="forgot.heading">Şifrəni bərpa edin</h1>
        <p class="lede" data-i18n="forgot.lede">Email ünvanınızı daxil edin, bərpa kodu göndərək.</p>

        <div id="alertBox"></div>

        <form id="forgotForm" novalidate style="text-align:left">
          <div class="field" style="text-align: left;">
            <label class="field-label" for="email" data-i18n="form.email">Email</label>
            <div class="input-wrap">
              <i class="bi bi-envelope leading-icon"></i>
              <input type="email" class="input has-icon" id="email" name="Email" placeholder="ad@nümunə.com" required maxlength="256" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
            <span data-i18n="forgot.submit">Bərpa kodu göndər</span> <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <p class="foot-line"><a href="login.html"><i class="bi bi-arrow-left"></i> <span data-i18n="auth.back_to_login">Girişə qayıt</span></a></p>
      </div>
      </div>
    </div>

    <div class="auth-visual-col">
      <div class="auth-orb auth-orb-a"></div>
      <div class="auth-orb auth-orb-b"></div>
      <div class="auth-visual-top">
        <div class="mark"><i class="bi bi-calendar-check"></i></div>
        <span class="word">MeetHub</span>
      </div>
      <div class="auth-visual-mid">
        <span class="tag"><i class="bi bi-shield-check"></i> <span data-i18n="forgot.visual.tag">Təhlükəsiz bərpa</span></span>
        <h2 data-i18n="forgot.visual.heading">Şifrəniz unudulub, problem deyil</h2>
        <p data-i18n="forgot.visual.lede">Email ünvanınıza 6 rəqəmli bərpa kodu göndəririk — bir neçə saniyəyə yenidən daxil ola bilərsiniz.</p>
      </div>
      <div class="auth-visual-bottom">© 2026 MeetHub</div>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/forgotPassword.js"></script>
  <script type="module">
    import { initThemeToggle } from "../javascripts/components/theme.js";
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initThemeToggle(document.getElementById("themeToggleBtn"));
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

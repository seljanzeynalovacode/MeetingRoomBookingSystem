<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Şifrəni bərpa et — MRBSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="scene">
    <div class="blob blob-violet"></div>
    <div class="blob blob-amber"></div>

    <div class="stage">
      <div class="auth-card text-center">
        <div class="brand-mark">
          <span class="logo">M</span>
          <span class="wordmark">MRBSystem</span>
        </div>

        <div class="icon-orb"><i class="bi bi-key"></i></div>

        <h1>Şifrəni bərpa edin</h1>
        <p class="lede">Email ünvanınızı daxil edin, bərpa kodu göndərək.</p>

        <div id="alertBox"></div>

        <form id="forgotForm" novalidate style="text-align:left">
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <div class="input-wrap">
              <i class="bi bi-envelope leading-icon"></i>
              <input type="email" class="input has-icon" id="email" name="Email" placeholder="ad@nümunə.com" required maxlength="256" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
            Bərpa kodu göndər <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <p class="foot-line"><a href="login.html"><i class="bi bi-arrow-left"></i> Girişə qayıt</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/forgotPassword.js"></script>
</body>
</html>

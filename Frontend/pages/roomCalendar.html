<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title data-i18n="meta.title.roomCalendar">Təqvim — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <a href="dashboard.html" style="display:contents;">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetHub</span>
      </div>
    </a>

       <div class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm"><i class="bi bi-door-open"></i><span data-i18n="nav.rooms">Otaqlar</span></a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm active"><i class="bi bi-calendar3"></i><span data-i18n="nav.calendar">Təqvim</span></a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-check"></i><span data-i18n="nav.myBookings">Rezervasiyalarım</span></a>
    </div>

       <div class="nav-right">
      <a href="adminDashboard.html" class="btn btn-outline btn-sm" id="adminPanelLink" style="display:none;"><i class="bi bi-shield-lock"></i><span data-i18n="nav.adminPanel">Admin panel</span></a>
      <button type="button" class="icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
      <button type="button" class="icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirişlər">
          <i class="bi bi-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none;"></span>
        </button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-head" data-i18n="notifications.title">Bildirişlər</div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      </div>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html"><i class="bi bi-person"></i><span data-i18n="user.profile">Profil</span></a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span data-i18n="user.logout">Çıxış</span></button>
        </div>
      </div>
    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="calendar-layout">
    <aside class="sidebar">
      <div class="card filter-card">
        <div class="filter-card-head">
          <i class="bi bi-building"></i>
          <h3 data-i18n="calendar.building_room">Bina və otaq</h3>
        </div>
        <div class="filter-group">
          <label class="field-label" for="buildingSelectBtn" data-i18n="filters.building">Bina</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="buildingSelectBtn"><span>Bütün binalar</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="buildingSelectPanel"></div>
          </div>
        </div>
        <div class="filter-group" style="margin-bottom: 0;">
          <label class="field-label" for="roomSelectBtn" data-i18n="calendar.room">Otaq</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="roomSelectBtn"><span>Seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="roomSelectPanel"></div>
          </div>
        </div>
      </div>

      <div class="card room-info-card">
        <div class="room-info-name" id="roomInfoName"></div>
        <div class="room-info-row"><i class="bi bi-building"></i><span id="roomInfoLocation"></span></div>
      </div>

      <div class="card legend-card">
        <div class="legend-row"><span class="legend-dot" style="background:var(--violet-500)"></span><span data-i18n="legend.reservation">Rezervasiya</span></div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--red-500)"></span><span data-i18n="legend.blackout">Bloklama</span></div>
      </div>
    </aside>

    <div class="main-col">
      <div class="calendar-header-row">
        <h2 data-i18n="nav.calendar">Təqvim</h2>

        <div class="calendar-controls">
          <button class="icon-btn" id="prevBtn" aria-label="Əvvəlki gün"><i class="bi bi-chevron-left"></i></button>
          <span class="date-label" id="dateLabel"></span>
          <button class="icon-btn" id="nextBtn" aria-label="Növbəti gün"><i class="bi bi-chevron-right"></i></button>
          <button class="btn btn-secondary btn-sm" id="todayBtn" data-i18n="calendar.today">Bu gün</button>
          <div class="view-toggle">
            <button type="button" id="dayViewBtn" class="active"><i class="bi bi-calendar-day"></i> <span data-i18n="calendar.day">Gün</span></button>
            <button type="button" id="weekViewBtn"><i class="bi bi-calendar-week"></i> <span data-i18n="calendar.week">Həftə</span></button>
          </div>
        </div>
      </div>

      <div id="calendarContent"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Naviqasiya">
    <a href="dashboard.html" class="bn-item"><span class="bn-ic"><i class="bi bi-door-open"></i></span><span data-i18n="nav.rooms">Otaqlar</span></a>
    <a href="roomCalendar.html" class="bn-item active"><span class="bn-ic"><i class="bi bi-calendar3"></i></span><span data-i18n="nav.calendar">Təqvim</span></a>
    <a href="myBookings.html" class="bn-item"><span class="bn-ic"><i class="bi bi-calendar-check"></i></span><span>Rezervlər</span></a>
    <button type="button" class="bn-item" id="bnAssistant"><span class="bn-ic"><i class="bi bi-robot"></i></span><span>Asistan</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script type="module" src="../javascripts/controllers/roomCalendar.js"></script>
  <script type="module">
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

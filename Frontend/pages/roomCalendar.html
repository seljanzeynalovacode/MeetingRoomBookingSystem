<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Təqvim — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <a href="dashboard.html" style="display:contents;">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetHub</span>
      </div>
    </a>

       <div class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm"><i class="bi bi-door-open"></i>Otaqlar</a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm active"><i class="bi bi-calendar3"></i>Təqvim</a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-check"></i>Rezervasiyalarım</a>
    </div>

       <div class="nav-right">
      <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menyu"><i class="bi bi-list"></i></button>
      <a href="adminDashboard.html" class="btn btn-outline btn-sm" id="adminPanelLink" style="display:none;"><i class="bi bi-shield-lock"></i>Admin panel</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirişlər">
          <i class="bi bi-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none;"></span>
        </button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-head">Bildirişlər</div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      </div>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html"><i class="bi bi-person"></i>Profil</a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
        </div>
      </div>
    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="calendar-layout">
    <aside class="sidebar">
      <div class="card filter-card">
        <div class="filter-card-head">
          <i class="bi bi-building"></i>
          <h3>Bina və otaq</h3>
        </div>
        <div class="filter-group">
          <label class="field-label" for="buildingSelectBtn">Bina</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="buildingSelectBtn"><span>Bütün binalar</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="buildingSelectPanel"></div>
          </div>
        </div>
        <div class="filter-group" style="margin-bottom: 0;">
          <label class="field-label" for="roomSelectBtn">Otaq</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="roomSelectBtn"><span>Seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="roomSelectPanel"></div>
          </div>
        </div>
      </div>

      <div class="card room-info-card">
        <div class="room-info-name" id="roomInfoName"></div>
        <div class="room-info-row"><i class="bi bi-building"></i><span id="roomInfoLocation"></span></div>
      </div>

      <div class="card legend-card">
        <div class="legend-row"><span class="legend-dot" style="background:var(--violet-500)"></span>Rezervasiya</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--red-500)"></span>Bloklama</div>
      </div>
    </aside>

    <div class="main-col">
      <div class="calendar-header-row">
        <h2>Təqvim</h2>

        <div class="calendar-controls">
          <button class="icon-btn" id="prevBtn" aria-label="Əvvəlki gün"><i class="bi bi-chevron-left"></i></button>
          <span class="date-label" id="dateLabel"></span>
          <button class="icon-btn" id="nextBtn" aria-label="Növbəti gün"><i class="bi bi-chevron-right"></i></button>
          <button class="btn btn-secondary btn-sm" id="todayBtn">Bu gün</button>
          <div class="view-toggle">
            <button type="button" id="dayViewBtn" class="active"><i class="bi bi-calendar-day"></i> Gün</button>
            <button type="button" id="weekViewBtn"><i class="bi bi-calendar-week"></i> Həftə</button>
          </div>
        </div>
      </div>

      <div id="calendarContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script type="module" src="../javascripts/controllers/roomCalendar.js"></script>
</body>
</html>

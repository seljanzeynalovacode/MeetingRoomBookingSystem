<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="meta.title.resetPassword">Yeni şifrə — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <button type="button" class="floating-theme-toggle" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
  <button type="button" class="floating-theme-toggle floating-lang-toggle" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
  <div class="auth-shell compact">
    <div class="auth-form-col stacked">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetHub</span>
      </div>

      <div class="auth-center-area">
      <div class="auth-card text-center" style="max-width: 420px;">
        <div class="icon-orb"><i class="bi bi-shield-check"></i></div>

        <h1 data-i18n="reset.heading">Yeni şifrə təyin edin</h1>
        <p class="lede" data-i18n="reset.lede">Email-ə göndərilən 6 rəqəmli kodu və yeni şifrənizi daxil edin.</p>

        <div id="alertBox"></div>

        <div class="field" style="text-align: left;">
          <label class="field-label" for="email" data-i18n="form.email">Email</label>
          <div class="input-wrap">
            <i class="bi bi-envelope leading-icon"></i>
            <input type="email" class="input has-icon" id="email" name="Email" placeholder="ad@nümunə.com" required maxlength="256" />
          </div>
        </div>

        <form id="resetForm" novalidate style="text-align:left">
          <div class="otp-row" id="otpRow">
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
          </div>

          <div id="passwordSection" class="is-locked">
            <div class="field">
              <label class="field-label" for="newPassword" data-i18n="form.newPassword">Yeni şifrə</label>
              <div class="input-wrap">
                <i class="bi bi-lock leading-icon"></i>
                <input type="password" class="input has-icon" id="newPassword" name="NewPassword" placeholder="••••••••" required minlength="6" maxlength="100" disabled />
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="confirmNewPassword" data-i18n="form.confirmNewPassword">Yeni şifrəni təsdiqlə</label>
              <div class="input-wrap">
                <i class="bi bi-lock-fill leading-icon"></i>
                <input type="password" class="input has-icon" id="confirmNewPassword" name="ConfirmNewPassword" placeholder="••••••••" required minlength="6" maxlength="100" disabled />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" disabled>
              <span data-i18n="reset.submit">Şifrəni yenilə</span> <i class="bi bi-check2"></i>
            </button>
          </div>
        </form>

        <p class="foot-line"><a href="login.html"><i class="bi bi-arrow-left"></i> <span data-i18n="auth.back_to_login">Girişə qayıt</span></a></p>
      </div>
      </div>
    </div>

    <div class="auth-visual-col">
      <div class="auth-orb auth-orb-a"></div>
      <div class="auth-orb auth-orb-b"></div>
      <div class="auth-visual-top">
        <div class="mark"><i class="bi bi-calendar-check"></i></div>
        <span class="word">MeetHub</span>
      </div>
      <div class="auth-visual-mid">
        <span class="tag"><i class="bi bi-lock"></i> <span data-i18n="reset.visual.tag">Son addım</span></span>
        <h2 data-i18n="reset.visual.heading">Güclü, yeni bir şifrə seçin</h2>
        <p data-i18n="reset.visual.lede">Kodu təsdiqlədikdən sonra yeni şifrənizi təyin edə bilərsiniz — hesabınız təhlükəsiz qalır.</p>
      </div>
      <div class="auth-visual-bottom">© 2026 MeetHub</div>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/resetPassword.js"></script>
  <script type="module">
    import { initThemeToggle } from "../javascripts/components/theme.js";
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initThemeToggle(document.getElementById("themeToggleBtn"));
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

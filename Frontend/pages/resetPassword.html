<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yeni şifrə — MeetingSpace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="scene">
    <div class="blob blob-amber"></div>
    <div class="blob blob-violet"></div>

    <div class="stage">
      <div class="auth-card text-center">
        <div class="brand-mark">
          <i class="bi bi-calendar-check logo"></i>
          <span class="wordmark">MeetingSpace</span>
        </div>

        <div class="icon-orb"><i class="bi bi-shield-check"></i></div>

        <h1>Yeni şifrə təyin edin</h1>
        <p class="lede">Email-ə göndərilən 6 rəqəmli kodu və yeni şifrənizi daxil edin.</p>

        <div id="alertBox"></div>

        <div class="field" style="max-width: 260px; margin: 0 auto 1.1rem; text-align: left;">
          <label class="field-label" for="email">Email</label>
          <div class="input-wrap">
            <i class="bi bi-envelope leading-icon"></i>
            <input type="email" class="input has-icon" id="email" name="Email" required maxlength="256" />
          </div>
        </div>

        <form id="resetForm" novalidate style="text-align:left">
          <div class="otp-row" id="otpRow">
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />
            <input class="otp-box" maxlength="1" inputmode="numeric" pattern="\d" />

                    <div id="passwordSection" class="is-locked">
            <div class="field">
              <label class="field-label" for="newPassword">Yeni şifrə</label>
              <div class="input-wrap">
                <i class="bi bi-lock leading-icon"></i>
                <input type="password" class="input has-icon" id="newPassword" name="NewPassword" placeholder="••••••••" required minlength="6" maxlength="100" disabled />
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="confirmNewPassword">Yeni şifrəni təsdiqlə</label>
              <div class="input-wrap">
                <i class="bi bi-lock-fill leading-icon"></i>
                <input type="password" class="input has-icon" id="confirmNewPassword" name="ConfirmNewPassword" placeholder="••••••••" required minlength="6" maxlength="100" disabled />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" disabled>
              Şifrəni yenilə <i class="bi bi-check2"></i>
            </button>
          </div>
        </form>

        <p class="foot-line"><a href="login.html"><i class="bi bi-arrow-left"></i> Girişə qayıt</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/resetPassword.js"></script>
</body>
</html>

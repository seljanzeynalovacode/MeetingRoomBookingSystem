<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title data-i18n="meta.title.adminProfile">Profil — Admin — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-head">
        <div class="brand-mark">
          <i class="bi bi-calendar-check logo"></i>
          <span class="wordmark">MeetHub</span>
        </div>
        <button type="button" class="sidebar-icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
        <button type="button" class="sidebar-icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
      </div>
      <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i><span data-i18n="admin.badge">Admin</span></span>
      <button type="button" class="admin-nav-toggle" id="adminNavToggle" aria-label="Menyunu aç/bağla"><i class="bi bi-list"></i></button>

      <div class="admin-nav-groups">
        <div class="nav-section-label" data-i18n="admin.nav.general">Ümumi</div>
        <nav class="admin-nav">
          <a href="adminDashboard.html"><i class="bi bi-grid-1x2"></i><span data-i18n="admin.nav.dashboard">Ana səhifə</span></a>
          <a href="adminUsers.html"><i class="bi bi-people"></i><span data-i18n="admin.nav.users">İstifadəçilər</span></a>
          <a href="adminReservations.html"><i class="bi bi-calendar-check"></i><span data-i18n="admin.nav.reservations">Rezervasiyalar</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.structure">Struktur</div>
        <nav class="admin-nav">
          <a href="adminBuildings.html"><i class="bi bi-building"></i><span data-i18n="admin.nav.buildings">Binalar</span></a>
          <a href="adminRooms.html"><i class="bi bi-door-open"></i><span data-i18n="nav.rooms">Otaqlar</span></a>
          <a href="adminEquipment.html"><i class="bi bi-projector"></i><span data-i18n="filters.equipment">Avadanlıq</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.activity">Fəaliyyət</div>
        <nav class="admin-nav">
          <a href="adminBlackouts.html"><i class="bi bi-calendar-x"></i><span data-i18n="admin.nav.blackouts">Bloklamalar</span></a>
          <a href="adminWorkingHours.html"><i class="bi bi-clock-history"></i><span data-i18n="admin.nav.workingHours">İş saatları</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.system">Sistem</div>
        <nav class="admin-nav">
          <a href="adminSettings.html"><i class="bi bi-gear"></i><span data-i18n="admin.nav.settings">Ayarlar</span></a>
        </nav>
      </div>

      <div class="admin-sidebar-footer">
        <div class="admin-account" id="adminAccountTrigger">
          <span class="admin-account-av" id="adminAccountInitials">--</span>
          <span class="admin-account-name" id="adminAccountName">Admin</span>
          <i class="bi bi-chevron-down"></i>
          <div class="admin-account-menu" id="adminAccountMenu">
            <a href="adminProfile.html" class="active"><i class="bi bi-person"></i><span data-i18n="user.profile">Profil</span></a>
            <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span data-i18n="user.logout">Çıxış</span></button>
          </div>
        </div>
      </div>
    </aside>

    <main class="admin-main" style="max-width:900px;">
      <div class="admin-topbar">
        <div>
          <h1 data-i18n="user.profile">Profil</h1>
          <p data-i18n="adminprofile.subtitle">Admin hesabınızın məlumatlarını idarə edin.</p>
        </div>
      </div>

      <div id="alertBox"></div>

      <div class="card profile-hero-card">
        <div id="profileHeroAvatar" class="profile-hero-avatar">--</div>
        <div>
          <div id="profileHeroName" class="profile-hero-name">Admin</div>
          <div id="profileHeroEmail" class="profile-hero-email"></div>
        </div>
      </div>

      <div class="profile-columns">
        <div class="card profile-column">
          <div class="profile-card-body">
            <h3 class="profile-card-title"><i class="bi bi-person-vcard"></i><span data-i18n="profile.info_title">Profil məlumatları</span></h3>
            <form id="profileForm" novalidate>
              <div class="field">
                <label class="field-label" for="firstNameInput" data-i18n="form.firstName">Ad</label>
                <div class="input-wrap">
                  <i class="bi bi-person leading-icon"></i>
                  <input type="text" class="input has-icon" id="firstNameInput" required minlength="2" maxlength="100" />
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="lastNameInput" data-i18n="form.lastName">Soyad</label>
                <div class="input-wrap">
                  <i class="bi bi-person leading-icon"></i>
                  <input type="text" class="input has-icon" id="lastNameInput" required minlength="2" maxlength="100" />
                </div>
              </div>
              <div class="field field-tight">
                <label class="field-label" for="userNameInput" data-i18n="form.username">İstifadəçi adı</label>
                <div class="input-wrap">
                  <i class="bi bi-at leading-icon"></i>
                  <input type="text" class="input has-icon" id="userNameInput" required minlength="3" maxlength="256" />
                </div>
              </div>
              <div class="profile-form-actions">
                <button type="submit" class="btn btn-primary" id="profileSubmitBtn" data-i18n="profile.save">Yadda saxla</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card profile-column">
          <div class="profile-card-body">
            <h3 class="profile-card-title"><i class="bi bi-shield-lock"></i><span data-i18n="profile.password_title">Şifrəni dəyiş</span></h3>
            <form id="passwordForm" novalidate>
              <div class="field">
                <label class="field-label" for="currentPasswordInput" data-i18n="form.currentPassword">Mövcud şifrə</label>
                <div class="input-wrap">
                  <i class="bi bi-lock leading-icon"></i>
                  <input type="password" class="input has-icon" id="currentPasswordInput" required />
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="newPasswordInput" data-i18n="form.newPassword">Yeni şifrə</label>
                <div class="input-wrap">
                  <i class="bi bi-lock leading-icon"></i>
                  <input type="password" class="input has-icon" id="newPasswordInput" required minlength="6" maxlength="100" />
                </div>
              </div>
              <div class="field field-tight">
                <label class="field-label" for="confirmNewPasswordInput" data-i18n="form.confirmNewPassword">Yeni şifrəni təsdiqlə</label>
                <div class="input-wrap">
                  <i class="bi bi-lock leading-icon"></i>
                  <input type="password" class="input has-icon" id="confirmNewPasswordInput" required minlength="6" maxlength="100" />
                </div>
              </div>
              <div class="profile-form-actions">
                <button type="submit" class="btn btn-primary" id="passwordSubmitBtn" data-i18n="profile.password_title">Şifrəni dəyiş</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../javascripts/controllers/adminProfile.js"></script>
  <script type="module">
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

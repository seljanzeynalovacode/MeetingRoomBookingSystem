<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title data-i18n="meta.title.adminUsers">İstifadəçilər — Admin — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-head">
        <div class="brand-mark">
          <i class="bi bi-calendar-check logo"></i>
          <span class="wordmark">MeetHub</span>
        </div>
        <button type="button" class="sidebar-icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
        <button type="button" class="sidebar-icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
      </div>
      <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i><span data-i18n="admin.badge">Admin</span></span>
      <button type="button" class="admin-nav-toggle" id="adminNavToggle" aria-label="Menyunu aç/bağla"><i class="bi bi-list"></i></button>

           <div class="admin-nav-groups">
        <div class="nav-section-label" data-i18n="admin.nav.general">Ümumi</div>
        <nav class="admin-nav">
          <a href="adminDashboard.html"><i class="bi bi-grid-1x2"></i><span data-i18n="admin.nav.dashboard">Ana səhifə</span></a>
          <a href="adminUsers.html" class="active"><i class="bi bi-people"></i><span data-i18n="admin.nav.users">İstifadəçilər</span></a>
          <a href="adminReservations.html"><i class="bi bi-calendar-check"></i><span data-i18n="admin.nav.reservations">Rezervasiyalar</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.structure">Struktur</div>
        <nav class="admin-nav">
          <a href="adminBuildings.html"><i class="bi bi-building"></i><span data-i18n="admin.nav.buildings">Binalar</span></a>
          <a href="adminRooms.html"><i class="bi bi-door-open"></i><span data-i18n="nav.rooms">Otaqlar</span></a>
          <a href="adminEquipment.html"><i class="bi bi-projector"></i><span data-i18n="filters.equipment">Avadanlıq</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.activity">Fəaliyyət</div>
        <nav class="admin-nav">
          <a href="adminBlackouts.html"><i class="bi bi-calendar-x"></i><span data-i18n="admin.nav.blackouts">Bloklamalar</span></a>
          <a href="adminWorkingHours.html"><i class="bi bi-clock-history"></i><span data-i18n="admin.nav.workingHours">İş saatları</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.system">Sistem</div>
        <nav class="admin-nav">
          <a href="adminSettings.html"><i class="bi bi-gear"></i><span data-i18n="admin.nav.settings">Ayarlar</span></a>
        </nav>
      </div>

      <div class="admin-sidebar-footer">
        <div class="admin-account" id="adminAccountTrigger">
          <span class="admin-account-av" id="adminAccountInitials">--</span>
          <span class="admin-account-name" id="adminAccountName">Admin</span>
          <i class="bi bi-chevron-down"></i>
          <div class="admin-account-menu" id="adminAccountMenu">
            <a href="adminProfile.html"><i class="bi bi-person"></i><span data-i18n="user.profile">Profil</span></a>
            <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span data-i18n="user.logout">Çıxış</span></button>
          </div>
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 data-i18n="adminusers.heading">İstifadəçilər və rollar</h1>
          <p data-i18n="adminusers.subtitle">İstifadəçilərə rol təyin edin, rolları idarə edin.</p>
        </div>
      </div>

      <div id="alertBox"></div>

           <div class="card role-manage-card">
        <div class="rm-header">
          <span class="rm-header-icon"><i class="bi bi-tags"></i></span>
          <div>
            <h3 data-i18n="adminusers.roles_title">Rollar</h3>
            <p data-i18n="adminusers.roles_subtitle">Sistemdəki rolları idarə edin</p>
          </div>
          <span class="rm-count" id="roleCount">0 rol</span>
        </div>

        <div class="rm-list" id="roleList"></div>

        <div class="rm-add-row">
          <div class="input-wrap">
            <i class="bi bi-plus-circle leading-icon"></i>
            <input type="text" class="input has-icon" id="newRoleInput" placeholder="Yeni rol adı daxil edin" data-i18n-placeholder="adminusers.new_role_placeholder" minlength="2" maxlength="256" />
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="addRoleBtn"><i class="bi bi-plus-lg"></i><span data-i18n="adminusers.create_role">Rol yarat</span></button>
        </div>
      </div>

            <div class="search-toolbar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" id="userSearchInput" placeholder="Ad, soyad, email və ya istifadəçi adına görə axtar..." data-i18n-placeholder="adminusers.search_placeholder" />
        </div>
        <div class="dd-wrap" id="filterRoleWrap">
          <button type="button" class="dd-btn" id="filterRoleBtn"><span>Bütün rollar</span><i class="bi bi-chevron-down"></i></button>
          <div class="dd-panel" id="filterRolePanel"></div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="resetUserSearchBtn"><i class="bi bi-arrow-counterclockwise"></i><span data-i18n="adminusers.refresh">Yenilə</span></button>
      </div>

      <div class="card">
        <div class="user-list" id="usersTableBody"></div>
      </div>
    </main>
  </div>

  <script type="module" src="../javascripts/controllers/adminUsers.js"></script>
  <script type="module">
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qeydiyyat — MRBSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="scene">
    <div class="blob blob-amber"></div>
    <div class="blob blob-violet"></div>

    <div class="stage stage-wide">
      <div class="auth-card">
        <div class="brand-mark">
          <span class="logo">M</span>
          <span class="wordmark">MRBSystem</span>
        </div>

        <h1>Hesab yaradın</h1>
        <p class="lede">30 saniyədə qeydiyyatdan keçin, otaq rezervasiyasına başlayın.</p>

        <div id="alertBox"></div>

        <form id="registerForm" novalidate>
          <div class="grid-2">
            <div class="field">
              <label class="field-label" for="firstName">Ad</label>
              <div class="input-wrap">
                <i class="bi bi-person leading-icon"></i>
                <input type="text" class="input has-icon" id="firstName" name="FirstName" placeholder="Adınız" required minlength="2" maxlength="100" />
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="lastName">Soyad</label>
              <div class="input-wrap">
                <i class="bi bi-person leading-icon"></i>
                <input type="text" class="input has-icon" id="lastName" name="LastName" placeholder="Soyadınız" required minlength="2" maxlength="100" />
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="username">İstifadəçi adı</label>
            <div class="input-wrap">
              <i class="bi bi-at leading-icon"></i>
              <input type="text" class="input has-icon" id="username" name="Username" placeholder="username" required minlength="3" maxlength="256" />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <div class="input-wrap">
              <i class="bi bi-envelope leading-icon"></i>
              <input type="email" class="input has-icon" id="email" name="Email" placeholder="ad@nümunə.com" required maxlength="256" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label class="field-label" for="password">Şifrə</label>
              <div class="input-wrap">
                <i class="bi bi-lock leading-icon"></i>
                <input type="password" class="input has-icon" id="password" name="Password" placeholder="••••••••" required minlength="6" maxlength="100" />
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="confirmPassword">Şifrəni təsdiqlə</label>
              <div class="input-wrap">
                <i class="bi bi-lock-fill leading-icon"></i>
                <input type="password" class="input has-icon" id="confirmPassword" name="ConfirmPassword" placeholder="••••••••" required minlength="6" maxlength="100" />
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top: 0.5rem">
            Qeydiyyatdan keç <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <p class="foot-line">Artıq hesabınız var? <a href="login.html">Daxil olun</a></p>
      </div>
    </div>
  </div>

 <script type="module" src="../javascripts/controllers/register.js"></script>
</body>
</html>

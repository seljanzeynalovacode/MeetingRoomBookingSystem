<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title>Otaqlar — Admin — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-head">
        <div class="brand-mark">
          <i class="bi bi-calendar-check logo"></i>
          <span class="wordmark">MeetHub</span>
        </div>
        <button type="button" class="sidebar-icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
      </div>
      <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i>Admin</span>
      <button type="button" class="admin-nav-toggle" id="adminNavToggle" aria-label="Menyunu aç/bağla"><i class="bi bi-list"></i></button>

           <div class="admin-nav-groups">
        <div class="nav-section-label">Ümumi</div>
        <nav class="admin-nav">
          <a href="adminDashboard.html"><i class="bi bi-grid-1x2"></i>Ana səhifə</a>
          <a href="adminUsers.html"><i class="bi bi-people"></i>İstifadəçilər</a>
          <a href="adminReservations.html"><i class="bi bi-calendar-check"></i>Rezervasiyalar</a>
        </nav>

        <div class="nav-section-label">Struktur</div>
        <nav class="admin-nav">
          <a href="adminBuildings.html"><i class="bi bi-building"></i>Binalar</a>
          <a href="adminRooms.html" class="active"><i class="bi bi-door-open"></i>Otaqlar</a>
          <a href="adminEquipment.html"><i class="bi bi-projector"></i>Avadanlıq</a>
        </nav>

        <div class="nav-section-label">Fəaliyyət</div>
        <nav class="admin-nav">
          <a href="adminBlackouts.html"><i class="bi bi-calendar-x"></i>Bloklamalar</a>
          <a href="adminWorkingHours.html"><i class="bi bi-clock-history"></i>İş saatları</a>
        </nav>

        <div class="nav-section-label">Sistem</div>
        <nav class="admin-nav">
          <a href="adminSettings.html"><i class="bi bi-gear"></i>Ayarlar</a>
        </nav>
      </div>

      <div class="admin-sidebar-footer">
        <div class="admin-account" id="adminAccountTrigger">
          <span class="admin-account-av" id="adminAccountInitials">--</span>
          <span class="admin-account-name" id="adminAccountName">Admin</span>
          <i class="bi bi-chevron-down"></i>
          <div class="admin-account-menu" id="adminAccountMenu">
            <a href="adminProfile.html"><i class="bi bi-person"></i>Profil</a>
            <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Otaqlar</h1>
          <p>Sistemdəki otaqları idarə edin.</p>
        </div>
        <button type="button" class="btn btn-primary" id="addRoomBtn"><i class="bi bi-plus-lg"></i>Yeni otaq</button>
      </div>

      <div id="alertBox"></div>

      <div class="card filter-toolbar">
        <div class="filter-toolbar-row">
          <div class="filter-group-inline">
            <label class="field-label">Bina</label>
            <div class="dd-wrap">
              <button type="button" class="dd-btn" id="filterBuildingBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
              <div class="dd-panel" id="filterBuildingPanel"></div>
            </div>
          </div>
          <div class="filter-group-inline">
            <label class="field-label">Mərtəbə</label>
            <div class="dd-wrap">
              <button type="button" class="dd-btn" id="filterFloorBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
              <div class="dd-panel" id="filterFloorPanel"></div>
            </div>
          </div>
          <div class="filter-group-inline">
            <label class="field-label">Status</label>
            <div class="dd-wrap">
              <button type="button" class="dd-btn" id="filterStatusBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
              <div class="dd-panel" id="filterStatusPanel"></div>
            </div>
          </div>
          <button type="button" class="icon-btn" id="resetFiltersBtn" title="Filtrləri sıfırla" aria-label="Filtrləri sıfırla"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>
      </div>

           <div id="roomsContainer"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="roomModal">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="roomModalTitle">Yeni otaq</h3>
        <button type="button" class="modal-close" id="roomModalClose" aria-label="Bağla"><i class="bi bi-x-lg"></i></button>
      </div>

      <div id="roomModalAlert"></div>

      <form id="roomForm" novalidate>
        <div class="field">
          <label class="field-label" for="roomName">Ad</label>
          <div class="input-wrap">
            <i class="bi bi-door-open leading-icon"></i>
            <input type="text" class="input has-icon" id="roomName" required minlength="1" maxlength="150" placeholder="Konfrans Zalı A" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="roomCapacity">Tutum</label>
          <div class="input-wrap">
            <i class="bi bi-people leading-icon"></i>
            <input type="number" class="input has-icon" id="roomCapacity" required min="1" max="1000" placeholder="10" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="roomModalBuildingBtn">Bina</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="roomModalBuildingBtn"><span>Seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="roomModalBuildingPanel"></div>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="roomModalFloorBtn">Mərtəbə</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="roomModalFloorBtn"><span>Seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="roomModalFloorPanel"></div>
          </div>
        </div>

                <div class="field">
          <label class="remember"><input type="checkbox" id="roomIsActive" checked />Aktiv</label>
        </div>

        <div class="field" id="roomEquipmentField" style="margin-bottom:0;">
          <label class="field-label">Avadanlıq</label>
          <div class="chip-toggle-group" id="roomEquipmentChips"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="roomModalCancelBtn">İmtina</button>
          <button type="submit" class="btn btn-primary" id="roomModalSubmitBtn">Yarat</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/adminRooms.js"></script>
</body>
</html>

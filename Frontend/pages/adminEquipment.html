<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avadanlıq — Admin — MeetingSpace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetingSpace</span>
      </div>
      <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i>Admin</span>

      <div class="admin-nav-groups">
        <div class="nav-section-label">Ümumi</div>
        <nav class="admin-nav">
          <a href="adminDashboard.html"><i class="bi bi-grid-1x2"></i>Ana səhifə</a>
          <a href="adminUsers.html"><i class="bi bi-people"></i>İstifadəçilər</a>
          <a href="adminReservations.html"><i class="bi bi-calendar-check"></i>Rezervasiyalar</a>
        </nav>

        <div class="nav-section-label">Struktur</div>
        <nav class="admin-nav">
          <a href="adminBuildings.html"><i class="bi bi-building"></i>Binalar</a>
          <a href="adminRooms.html"><i class="bi bi-door-open"></i>Otaqlar</a>
          <a href="adminEquipment.html" class="active"><i class="bi bi-projector"></i>Avadanlıq</a>
        </nav>

        <div class="nav-section-label">Fəaliyyət</div>
        <nav class="admin-nav">
          <a href="adminBlackouts.html"><i class="bi bi-calendar-x"></i>Bloklamalar</a>
          <a href="adminWorkingHours.html"><i class="bi bi-clock-history"></i>İş saatları</a>
        </nav>

        <div class="nav-section-label">Sistem</div>
        <nav class="admin-nav">
          <a href="adminSettings.html"><i class="bi bi-gear"></i>Ayarlar</a>
        </nav>
      </div>

      <div class="admin-sidebar-footer">
        <a href="dashboard.html"><i class="bi bi-arrow-left"></i>Tətbiqə qayıt</a>
        <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Avadanlıq</h1>
          <p>Otaqlara təyin edilə bilən avadanlıq növlərini idarə edin.</p>
        </div>
        <button type="button" class="btn btn-primary" id="addEquipmentBtn"><i class="bi bi-plus-lg"></i>Yeni avadanlıq</button>
      </div>

      <div id="alertBox"></div>
            <div class="search-toolbar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" id="equipmentSearchInput" placeholder="Avadanlıq adı ilə axtar..." />
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="resetSearchBtn"><i class="bi bi-arrow-counterclockwise"></i>Yenilə</button>
      </div>

      <div class="equipment-grid" id="equipmentGrid"></div>
    </main>
  </div>

  <div class="modal-overlay" id="equipmentModal">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="equipmentModalTitle">Yeni avadanlıq</h3>
        <button type="button" class="modal-close" id="equipmentModalClose" aria-label="Bağla"><i class="bi bi-x-lg"></i></button>
      </div>

      <div id="equipmentModalAlert"></div>

      <form id="equipmentForm" novalidate>
        <div class="field" style="margin-bottom:0;">
          <label class="field-label" for="equipmentName">Ad</label>
          <div class="input-wrap">
            <i class="bi bi-projector leading-icon"></i>
            <input type="text" class="input has-icon" id="equipmentName" required minlength="2" maxlength="150" placeholder="Proyektor" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="equipmentModalCancelBtn">İmtina</button>
          <button type="submit" class="btn btn-primary" id="equipmentModalSubmitBtn">Yarat</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/adminEquipment.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloklamalar — Admin — MeetingSpace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetingSpace</span>
      </div>
      <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i>Admin</span>

           <div class="admin-nav-groups">
        <div class="nav-section-label">Ümumi</div>
        <nav class="admin-nav">
          <a href="adminDashboard.html"><i class="bi bi-grid-1x2"></i>Ana səhifə</a>
          <a href="adminUsers.html"><i class="bi bi-people"></i>İstifadəçilər</a>
          <a href="adminReservations.html"><i class="bi bi-calendar-check"></i>Rezervasiyalar</a>
        </nav>

        <div class="nav-section-label">Struktur</div>
        <nav class="admin-nav">
          <a href="adminBuildings.html"><i class="bi bi-building"></i>Binalar</a>
          <a href="adminRooms.html"><i class="bi bi-door-open"></i>Otaqlar</a>
          <a href="adminEquipment.html"><i class="bi bi-projector"></i>Avadanlıq</a>
        </nav>

        <div class="nav-section-label">Fəaliyyət</div>
        <nav class="admin-nav">
          <a href="adminBlackouts.html" class="active"><i class="bi bi-calendar-x"></i>Bloklamalar</a>
        </nav>
      </div>

      <div class="admin-sidebar-footer">
        <a href="dashboard.html"><i class="bi bi-arrow-left"></i>Tətbiqə qayıt</a>
        <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Bloklamalar</h1>
          <p>Otaqları müəyyən tarix/saat aralığında bloklayın.</p>
        </div>
        <button type="button" class="btn btn-primary" id="addBlackoutBtn"><i class="bi bi-plus-lg"></i>Yeni bloklama</button>
      </div>

      <div id="alertBox"></div>

      <div class="blackout-list" id="blackoutsList"></div>
    </main>
  </div>

  <div class="modal-overlay" id="blackoutModal">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="blackoutModalTitle">Yeni bloklama</h3>
        <button type="button" class="modal-close" id="blackoutModalClose" aria-label="Bağla"><i class="bi bi-x-lg"></i></button>
      </div>

      <div id="blackoutModalAlert"></div>

      <form id="blackoutForm" novalidate>
        <div class="field">
          <label class="field-label" for="blackoutRoom">Otaq</label>
          <select class="input" id="blackoutRoom" required></select>
        </div>

        <div class="field">
          <label class="field-label" for="blackoutDate">Tarix</label>
          <input type="date" class="input" id="blackoutDate" required />
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="blackoutStart">Başlama</label>
            <input type="time" class="input" id="blackoutStart" required />
          </div>
          <div class="field">
            <label class="field-label" for="blackoutEnd">Bitmə</label>
            <input type="time" class="input" id="blackoutEnd" required />
          </div>
        </div>

        <div class="field" style="margin-bottom:0;">
          <label class="field-label" for="blackoutReason">Səbəb</label>
          <div class="input-wrap">
            <i class="bi bi-card-text leading-icon"></i>
            <input type="text" class="input has-icon" id="blackoutReason" required minlength="3" maxlength="500" placeholder="Təmir işləri" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="blackoutModalCancelBtn">İmtina</button>
          <button type="submit" class="btn btn-primary" id="blackoutModalSubmitBtn">Yarat</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/adminBlackouts.js"></script>
</body>
</html>

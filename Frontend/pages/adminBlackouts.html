<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title data-i18n="meta.title.adminBlackouts">Bloklamalar — Admin — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-head">
        <div class="brand-mark">
          <i class="bi bi-calendar-check logo"></i>
          <span class="wordmark">MeetHub</span>
        </div>
        <button type="button" class="sidebar-icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
        <button type="button" class="sidebar-icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
      </div>
      <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i><span data-i18n="admin.badge">Admin</span></span>
      <button type="button" class="admin-nav-toggle" id="adminNavToggle" aria-label="Menyunu aç/bağla"><i class="bi bi-list"></i></button>

           <div class="admin-nav-groups">
        <div class="nav-section-label" data-i18n="admin.nav.general">Ümumi</div>
        <nav class="admin-nav">
          <a href="adminDashboard.html"><i class="bi bi-grid-1x2"></i><span data-i18n="admin.nav.dashboard">Ana səhifə</span></a>
          <a href="adminUsers.html"><i class="bi bi-people"></i><span data-i18n="admin.nav.users">İstifadəçilər</span></a>
          <a href="adminReservations.html"><i class="bi bi-calendar-check"></i><span data-i18n="admin.nav.reservations">Rezervasiyalar</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.structure">Struktur</div>
        <nav class="admin-nav">
          <a href="adminBuildings.html"><i class="bi bi-building"></i><span data-i18n="admin.nav.buildings">Binalar</span></a>
          <a href="adminRooms.html"><i class="bi bi-door-open"></i><span data-i18n="nav.rooms">Otaqlar</span></a>
          <a href="adminEquipment.html"><i class="bi bi-projector"></i><span data-i18n="filters.equipment">Avadanlıq</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.activity">Fəaliyyət</div>
        <nav class="admin-nav">
          <a href="adminBlackouts.html" class="active"><i class="bi bi-calendar-x"></i><span data-i18n="admin.nav.blackouts">Bloklamalar</span></a>
          <a href="adminWorkingHours.html"><i class="bi bi-clock-history"></i><span data-i18n="admin.nav.workingHours">İş saatları</span></a>
        </nav>

        <div class="nav-section-label" data-i18n="admin.nav.system">Sistem</div>
        <nav class="admin-nav">
          <a href="adminSettings.html"><i class="bi bi-gear"></i><span data-i18n="admin.nav.settings">Ayarlar</span></a>
        </nav>
      </div>

      <div class="admin-sidebar-footer">
        <div class="admin-account" id="adminAccountTrigger">
          <span class="admin-account-av" id="adminAccountInitials">--</span>
          <span class="admin-account-name" id="adminAccountName">Admin</span>
          <i class="bi bi-chevron-down"></i>
          <div class="admin-account-menu" id="adminAccountMenu">
            <a href="adminProfile.html"><i class="bi bi-person"></i><span data-i18n="user.profile">Profil</span></a>
            <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span data-i18n="user.logout">Çıxış</span></button>
          </div>
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 data-i18n="admin.nav.blackouts">Bloklamalar</h1>
          <p data-i18n="adminblackouts.subtitle">Otaqları müəyyən tarix/saat aralığında bloklayın.</p>
        </div>
        <button type="button" class="btn btn-primary" id="addBlackoutBtn"><i class="bi bi-plus-lg"></i><span data-i18n="adminblackouts.add">Yeni bloklama</span></button>
      </div>

      <div id="alertBox"></div>

      <div class="card filter-toolbar">
        <div class="filter-toolbar-row">
          <div class="filter-group-inline">
            <label class="field-label" data-i18n="filters.building">Bina</label>
            <div class="dd-wrap">
              <button type="button" class="dd-btn" id="filterBuildingBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
              <div class="dd-panel" id="filterBuildingPanel"></div>
            </div>
          </div>
          <div class="filter-group-inline">
            <label class="field-label" data-i18n="calendar.room">Otaq</label>
            <div class="dd-wrap">
              <button type="button" class="dd-btn" id="filterRoomBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
              <div class="dd-panel" id="filterRoomPanel"></div>
            </div>
          </div>
          <div class="filter-group-inline">
            <label class="field-label" data-i18n="filters.date">Tarix</label>
            <input type="date" class="input" id="filterDate" />
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="clearFiltersBtn"><i class="bi bi-arrow-counterclockwise"></i><span data-i18n="filters.reset">Sıfırla</span></button>
        </div>
      </div>

      <div class="blackout-list" id="blackoutsList"></div>
    </main>
  </div>

  <div class="modal-overlay" id="blackoutModal">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="blackoutModalTitle">Yeni bloklama</h3>
        <button type="button" class="modal-close" id="blackoutModalClose" aria-label="Bağla"><i class="bi bi-x-lg"></i></button>
      </div>

      <div id="blackoutModalAlert"></div>

      <form id="blackoutForm" novalidate>
        <div class="field">
          <label class="field-label" for="blackoutRoomBtn" data-i18n="calendar.room">Otaq</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="blackoutRoomBtn"><span>Seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="blackoutRoomPanel"></div>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="blackoutDate" data-i18n="filters.date">Tarix</label>
          <input type="date" class="input" id="blackoutDate" required />
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="blackoutStart" data-i18n="adminblackouts.start">Başlama</label>
            <input type="time" class="input" id="blackoutStart" required />
          </div>
          <div class="field">
            <label class="field-label" for="blackoutEnd" data-i18n="adminblackouts.end">Bitmə</label>
            <input type="time" class="input" id="blackoutEnd" required />
          </div>
        </div>

        <div class="field" style="margin-bottom:0;">
          <label class="field-label" for="blackoutReason" data-i18n="adminblackouts.reason">Səbəb</label>
          <div class="input-wrap">
            <i class="bi bi-card-text leading-icon"></i>
            <input type="text" class="input has-icon" id="blackoutReason" required minlength="3" maxlength="500" placeholder="Təmir işləri" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="blackoutModalCancelBtn" data-i18n="common.cancel">İmtina</button>
          <button type="submit" class="btn btn-primary" id="blackoutModalSubmitBtn" data-i18n="common.create">Yarat</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/adminBlackouts.js"></script>
  <script type="module">
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

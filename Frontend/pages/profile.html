<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil — MeetingSpace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <a href="dashboard.html" style="display:contents;">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetingSpace</span>
      </div>
    </a>

    <div class="nav-right">
      <a href="dashboard.html" class="btn btn-ghost btn-sm"><i class="bi bi-door-open"></i>Otaqlar</a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar3"></i>Təqvim</a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-check"></i>Rezervasiyalarım</a>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html" class="active"><i class="bi bi-person"></i>Profil</a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
        </div>
      </div>
    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="reservations-layout">
            <div class="content-head">
      <div>
        <h2 style="display:flex; align-items:center; gap:10px;"><i class="bi bi-person-fill" style="color: rgb(51, 26, 95);"></i>Profil</h2>
               <p style="font-size:13px; color:var(--text-secondary); margin:0.25rem 0 0;">Hesab məlumatlarınızı idarə edin.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.25rem; padding:1.5rem; display:flex; align-items:center; gap:1.1rem;">
      <div id="profileHeroAvatar" style="width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg, var(--violet-500), var(--amber-500)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; box-shadow:var(--shadow-md); flex-shrink:0;">--</div>
      <div>
        <div id="profileHeroName" style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem;">İstifadəçi</div>
        <div id="profileHeroEmail" style="font-size:13px; color:var(--text-secondary); margin-top:2px;"></div>
      </div>
    </div>

    <div style="display:flex; gap:1.25rem; flex-wrap:wrap; align-items:flex-start;">
      <div class="card" style="flex:1 1 380px;">
      <div style="padding:1.5rem;">
        <h3 style="margin:0 0 1.1rem; display:flex; align-items:center; gap:8px;"><i class="bi bi-person-vcard" style="color:var(--violet-500);"></i>Profil məlumatları</h3>
        <form id="profileForm" novalidate>
          <div class="field">
            <label class="field-label" for="firstNameInput">Ad</label>
            <div class="input-wrap">
              <i class="bi bi-person leading-icon"></i>
              <input type="text" class="input has-icon" id="firstNameInput" required minlength="2" maxlength="100" />
            </div>
          </div>
                    <div class="field">
            <label class="field-label" for="lastNameInput">Soyad</label>
            <div class="input-wrap">
              <i class="bi bi-person leading-icon"></i>
              <input type="text" class="input has-icon" id="lastNameInput" required minlength="2" maxlength="100" />
            </div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label class="field-label" for="userNameInput">İstifadəçi adı</label>
            <div class="input-wrap">
              <i class="bi bi-at leading-icon"></i>
              <input type="text" class="input has-icon" id="userNameInput" required minlength="3" maxlength="256" />
            </div>
          </div>
          <div style="margin-top:1.25rem;">
            <button type="submit" class="btn btn-primary" id="profileSubmitBtn">Yadda saxla</button>
          </div>
        </form>
      </div>
    </div>

      <div class="card" style="flex:1 1 380px;">
      <div style="padding:1.5rem;">
        <h3 style="margin:0 0 1.1rem; display:flex; align-items:center; gap:8px;"><i class="bi bi-shield-lock" style="color:var(--violet-500);"></i>Şifrəni dəyiş</h3>
        <form id="passwordForm" novalidate>
          <div class="field">
            <label class="field-label" for="currentPasswordInput">Mövcud şifrə</label>
            <div class="input-wrap">
              <i class="bi bi-lock leading-icon"></i>
              <input type="password" class="input has-icon" id="currentPasswordInput" required />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="newPasswordInput">Yeni şifrə</label>
            <div class="input-wrap">
              <i class="bi bi-lock leading-icon"></i>
              <input type="password" class="input has-icon" id="newPasswordInput" required minlength="6" maxlength="100" />
            </div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label class="field-label" for="confirmNewPasswordInput">Yeni şifrəni təsdiqlə</label>
            <div class="input-wrap">
              <i class="bi bi-lock leading-icon"></i>
              <input type="password" class="input has-icon" id="confirmNewPasswordInput" required minlength="6" maxlength="100" />
            </div>
          </div>
          <div style="margin-top:1.25rem;">
            <button type="submit" class="btn btn-primary" id="passwordSubmitBtn">Şifrəni dəyiş</button>
          </div>
        </form>
      </div>
      </div>
    </div>
  </div>

  <script type="module" src="../javascripts/controllers/profile.js"></script>
</body>
</html>

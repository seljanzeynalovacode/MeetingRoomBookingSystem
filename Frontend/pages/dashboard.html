<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Otaqlar — MeetingSpace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <div class="brand-mark">
      <i class="bi bi-calendar-check logo"></i>
      <span class="wordmark">MeetingSpace</span>
    </div>

        <div class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm active"><i class="bi bi-door-open"></i>Otaqlar</a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar3"></i>Təqvim</a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-check"></i>Rezervasiyalarım</a>
    </div>

              <div class="nav-right">
                <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menyu"><i class="bi bi-list"></i></button>
                <a href="adminDashboard.html" class="btn btn-outline btn-sm" id="adminPanelLink" style="display:none;"><i class="bi bi-shield-lock"></i>Admin panel</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirişlər">
          <i class="bi bi-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none;"></span>
        </button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-head">Bildirişlər</div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      </div>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html"><i class="bi bi-person"></i>Profil</a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
        </div>
        
      </div>
            
    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="dash-layout">
    <aside class="sidebar">
      <div class="card filter-card">
        <div class="filter-card-head">
          <h3><i class="bi bi-sliders"></i>Filtrlər</h3>
          <button type="button" class="icon-btn" id="resetFiltersBtn" title="Filtrləri sıfırla" aria-label="Filtrləri sıfırla"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>

        <div class="filter-group">
          <label class="field-label" for="searchDate">Tarix</label>
          <div class="input-wrap">
            <i class="bi bi-calendar3 leading-icon"></i>
            <input type="date" class="input has-icon" id="searchDate" name="searchDate" />
          </div>
        </div>

        <div class="filter-group">
          <label class="field-label">Saat aralığı</label>
          <div class="time-range-row">
            <input type="time" class="input" id="searchStart" name="searchStart" />
            <span class="time-sep">–</span>
            <input type="time" class="input" id="searchEnd" name="searchEnd" />
          </div>
        </div>

        <div class="filter-card-divider"></div>

        <div class="filter-group">
          <label class="field-label" for="buildingSelectBtn">Bina</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="buildingSelectBtn"><span>Bina seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="buildingSelectPanel"></div>
          </div>
        </div>

        <div class="filter-group">
          <label class="field-label" for="floorSelectBtn">Mərtəbə</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="floorSelectBtn"><span>Bütün mərtəbələr</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="floorSelectPanel"></div>
          </div>
        </div>

        <div class="filter-group">
          <label class="field-label" for="capacityInput">Minimum tutum</label>
          <div class="input-wrap">
            <i class="bi bi-people leading-icon"></i>
            <input type="number" class="input has-icon" id="capacityInput" min="1" max="1000" value="1" />
          </div>
        </div>

        <div class="filter-group" style="margin-bottom: 0.5rem;">
          <label class="field-label">Avadanlıq</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="equipmentSelectBtn"><span>Avadanlıq seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="equipmentSelectPanel"></div>
          </div>
          <div class="chip-toggle-group" id="equipmentChips" style="margin-top:8px;"></div>
        </div>

        <button type="button" class="btn btn-primary btn-block btn-sm" id="applyFiltersBtn"><i class="bi bi-funnel"></i>Filtrlə</button>
      </div>
    </aside>

    <main>
            <div class="content-head">
        <h2 id="resultsTitle">Otaqlar <span class="count" id="resultsCount"></span></h2>
      </div>

      <p class="catalog-hint" id="catalogHint">Bu, bütün otaqların ümumi siyahısıdır. Konkret tarix/saat üçün dəqiq mövcudluğu yoxlamaq üçün soldakı paneldən axtarış edin.</p>

      <div class="room-grid" id="roomGrid"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="../javascripts/controllers/dashboard.js"></script>
</body>
</html>

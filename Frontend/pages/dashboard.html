<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title data-i18n="meta.title.dashboard">Otaqlar — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <div class="brand-mark">
      <i class="bi bi-calendar-check logo"></i>
      <span class="wordmark">MeetHub</span>
    </div>

        <div class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm active"><i class="bi bi-door-open"></i><span data-i18n="nav.rooms">Otaqlar</span></a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar3"></i><span data-i18n="nav.calendar">Təqvim</span></a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-check"></i><span data-i18n="nav.myBookings">Rezervasiyalarım</span></a>
    </div>

              <div class="nav-right">
                <a href="adminDashboard.html" class="btn btn-outline btn-sm" id="adminPanelLink" style="display:none;"><i class="bi bi-shield-lock"></i><span data-i18n="nav.adminPanel">Admin panel</span></a>
      <button type="button" class="icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
      <button type="button" class="icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirişlər">
          <i class="bi bi-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none;"></span>
        </button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-head" data-i18n="notifications.title">Bildirişlər</div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      </div>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html"><i class="bi bi-person"></i><span data-i18n="user.profile">Profil</span></a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span data-i18n="user.logout">Çıxış</span></button>
        </div>

      </div>

    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="dash-layout">
    <aside class="sidebar">
      <div class="card filter-card">
        <div class="filter-card-head">
          <h3><i class="bi bi-sliders"></i><span data-i18n="filters.title">Filtrlər</span></h3>
          <button type="button" class="icon-btn" id="resetFiltersBtn" title="Filtrləri sıfırla" aria-label="Filtrləri sıfırla"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>

        <div class="filter-group">
          <label class="field-label" for="searchDate" data-i18n="filters.date">Tarix</label>
          <div class="input-wrap">
            <i class="bi bi-calendar3 leading-icon"></i>
            <input type="date" class="input has-icon" id="searchDate" name="searchDate" />
          </div>
        </div>

        <div class="filter-group">
          <label class="field-label" data-i18n="filters.time_range">Saat aralığı</label>
          <div class="time-range-row">
            <input type="time" class="input" id="searchStart" name="searchStart" />
            <span class="time-sep">–</span>
            <input type="time" class="input" id="searchEnd" name="searchEnd" />
          </div>
        </div>

        <div class="filter-card-divider"></div>

        <div class="filter-group">
          <label class="field-label" for="buildingSelectBtn" data-i18n="filters.building">Bina</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="buildingSelectBtn"><span>Bina seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="buildingSelectPanel"></div>
          </div>
        </div>

        <div class="filter-group">
          <label class="field-label" for="floorSelectBtn" data-i18n="filters.floor">Mərtəbə</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="floorSelectBtn"><span>Bütün mərtəbələr</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="floorSelectPanel"></div>
          </div>
        </div>

        <div class="filter-group">
          <label class="field-label" for="capacityInput" data-i18n="filters.capacity">Minimum tutum</label>
          <div class="input-wrap">
            <i class="bi bi-people leading-icon"></i>
            <input type="number" class="input has-icon" id="capacityInput" min="1" max="1000" value="1" />
          </div>
        </div>

        <div class="filter-group" style="margin-bottom: 0.5rem;">
          <label class="field-label" data-i18n="filters.equipment">Avadanlıq</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="equipmentSelectBtn"><span>Avadanlıq seçin</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="equipmentSelectPanel"></div>
          </div>
          <div class="chip-toggle-group" id="equipmentChips" style="margin-top:8px;"></div>
        </div>

        <button type="button" class="btn btn-primary btn-block btn-sm" id="applyFiltersBtn"><i class="bi bi-funnel"></i><span data-i18n="filters.apply">Filtrlə</span></button>
      </div>
    </aside>

    <main>
            <div class="content-head">
        <h2 id="resultsTitle">Otaqlar <span class="count" id="resultsCount"></span></h2>
      </div>

      <p class="catalog-hint" id="catalogHint" data-i18n="dashboard.catalog_hint">Bu, bütün otaqların ümumi siyahısıdır. Konkret tarix/saat üçün dəqiq mövcudluğu yoxlamaq üçün soldakı paneldən axtarış edin.</p>

      <div class="room-grid" id="roomGrid"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="bottom-nav" aria-label="Naviqasiya">
    <a href="dashboard.html" class="bn-item active"><span class="bn-ic"><i class="bi bi-door-open"></i></span><span data-i18n="nav.rooms">Otaqlar</span></a>
    <a href="roomCalendar.html" class="bn-item"><span class="bn-ic"><i class="bi bi-calendar3"></i></span><span data-i18n="nav.calendar">Təqvim</span></a>
    <a href="myBookings.html" class="bn-item"><span class="bn-ic"><i class="bi bi-calendar-check"></i></span><span>Rezervlər</span></a>
    <button type="button" class="bn-item" id="bnAssistant"><span class="bn-ic"><i class="bi bi-robot"></i></span><span>Asistan</span></button>
  </nav>

  <script type="module" src="../javascripts/controllers/dashboard.js"></script>
  <script type="module">
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rezervasiyalarım — MeetingSpace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <a href="dashboard.html" style="display:contents;">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetingSpace</span>
      </div>
    </a>

                <div class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm"><i class="bi bi-door-open"></i>Otaqlar</a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar3"></i>Təqvim</a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm active"><i class="bi bi-calendar-check"></i>Rezervasiyalarım</a>
    </div>

                <div class="nav-right">
      <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menyu"><i class="bi bi-list"></i></button>
      <a href="adminDashboard.html" class="btn btn-outline btn-sm" id="adminPanelLink" style="display:none;"><i class="bi bi-shield-lock"></i>Admin panel</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirişlər">
          <i class="bi bi-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none;"></span>
        </button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-head">Bildirişlər</div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      </div>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html"><i class="bi bi-person"></i>Profil</a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Çıxış</button>
        </div>
      </div>
    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="mybookings-layout">
    <aside class="sidebar">
      <div class="card filter-card">
        <div class="filter-card-head">
          <i class="bi bi-funnel"></i>
          <h3>Filtrlər</h3>
        </div>
        <div class="filter-group">
          <label class="field-label">Status</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="filterStatusBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="filterStatusPanel"></div>
          </div>
        </div>
        <div class="filter-group">
          <label class="field-label" for="filterDate">Tarix</label>
          <div class="input-wrap">
            <i class="bi bi-calendar3 leading-icon"></i>
            <input type="date" class="input has-icon" id="filterDate" />
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm btn-block" id="clearFiltersBtn"><i class="bi bi-arrow-counterclockwise"></i>Sıfırla</button>
      </div>

      <div class="card stats-card">
        <div class="stats-row">
          <span class="stats-dot" style="background:var(--green-500)"></span>
          <span class="stats-label">Təsdiqlənib</span>
          <span class="stats-value" id="statConfirmed">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-dot" style="background:var(--amber-600)"></span>
          <span class="stats-label">Tamamlanıb</span>
          <span class="stats-value" id="statCompleted">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-dot" style="background:var(--red-500)"></span>
          <span class="stats-label">Ləğv edilib</span>
          <span class="stats-value" id="statCancelled">0</span>
        </div>
      </div>
    </aside>

    <div>
      <div class="content-head">
        <h2>Rezervasiyalarım</h2>
      </div>

      <div class="mb2-groups" id="reservationList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script type="module" src="../javascripts/controllers/myBookings.js"></script>
</body>
</html>

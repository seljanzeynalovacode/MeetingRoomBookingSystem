<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem('mrb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title data-i18n="meta.title.myBookings">Rezervasiyalarım — MeetHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">
  <header class="topnav">
    <a href="dashboard.html" style="display:contents;">
      <div class="brand-mark">
        <i class="bi bi-calendar-check logo"></i>
        <span class="wordmark">MeetHub</span>
      </div>
    </a>

                <div class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm"><i class="bi bi-door-open"></i><span data-i18n="nav.rooms">Otaqlar</span></a>
      <a href="roomCalendar.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar3"></i><span data-i18n="nav.calendar">Təqvim</span></a>
      <a href="myBookings.html" class="btn btn-ghost btn-sm active"><i class="bi bi-calendar-check"></i><span data-i18n="nav.myBookings">Rezervasiyalarım</span></a>
    </div>

                <div class="nav-right">
      <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menyu"><i class="bi bi-list"></i></button>
      <a href="adminDashboard.html" class="btn btn-outline btn-sm" id="adminPanelLink" style="display:none;"><i class="bi bi-shield-lock"></i><span data-i18n="nav.adminPanel">Admin panel</span></a>
      <button type="button" class="icon-btn" id="themeToggleBtn" aria-label="Tünd rejimə keç"><i class="bi bi-moon-stars"></i></button>
      <button type="button" class="icon-btn lang-toggle-btn" id="langToggleBtn" aria-label="Dili dəyiş">EN</button>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirişlər">
          <i class="bi bi-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none;"></span>
        </button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-head" data-i18n="notifications.title">Bildirişlər</div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      </div>
      <div class="avatar-chip" id="avatarChip">
        <span class="av" id="avatarInitials">--</span>
        <span class="name" id="avatarName">İstifadəçi</span>
        <i class="bi bi-chevron-down"></i>
        <div class="avatar-menu" id="avatarMenu">
          <a href="profile.html"><i class="bi bi-person"></i><span data-i18n="user.profile">Profil</span></a>
          <button type="button" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span data-i18n="user.logout">Çıxış</span></button>
        </div>
      </div>
    </div>
  </header>

  <div class="dash-alert" id="alertBox"></div>

  <div class="mybookings-layout">
    <aside class="sidebar">
      <div class="card filter-card">
        <div class="filter-card-head">
          <i class="bi bi-funnel"></i>
          <h3 data-i18n="filters.title">Filtrlər</h3>
        </div>
        <div class="filter-group">
          <label class="field-label" data-i18n="filters.status">Status</label>
          <div class="dd-wrap">
            <button type="button" class="dd-btn" id="filterStatusBtn"><span>Hamısı</span><i class="bi bi-chevron-down"></i></button>
            <div class="dd-panel" id="filterStatusPanel"></div>
          </div>
        </div>
        <div class="filter-group">
          <label class="field-label" for="filterDate" data-i18n="filters.date">Tarix</label>
          <div class="input-wrap">
            <i class="bi bi-calendar3 leading-icon"></i>
            <input type="date" class="input has-icon" id="filterDate" />
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm btn-block" id="clearFiltersBtn"><i class="bi bi-arrow-counterclockwise"></i><span data-i18n="filters.reset">Sıfırla</span></button>
      </div>

      <div class="card stats-card">
        <div class="stats-row">
          <span class="stats-dot" style="background:var(--green-500)"></span>
          <span class="stats-label" data-i18n="stats.confirmed">Təsdiqlənib</span>
          <span class="stats-value" id="statConfirmed">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-dot" style="background:var(--amber-600)"></span>
          <span class="stats-label" data-i18n="stats.completed">Tamamlanıb</span>
          <span class="stats-value" id="statCompleted">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-dot" style="background:var(--red-500)"></span>
          <span class="stats-label" data-i18n="stats.cancelled">Ləğv edilib</span>
          <span class="stats-value" id="statCancelled">0</span>
        </div>
      </div>
    </aside>

    <div>
      <div class="content-head">
        <h2 data-i18n="nav.myBookings">Rezervasiyalarım</h2>
      </div>

      <div class="mb2-groups" id="reservationList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script type="module" src="../javascripts/controllers/myBookings.js"></script>
  <script type="module">
    import { initLangToggle } from "../javascripts/components/i18n.js";
    initLangToggle(document.getElementById("langToggleBtn"));
  </script>
</body>
</html>

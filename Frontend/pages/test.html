<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRBSystem — Mərtəbələr</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .building-stroke { stroke-width: 3px; }
  </style>
</head>
<body class="bg-[#EAEEF4] min-h-screen flex text-slate-900">

  <!-- LEFT SIDEBAR -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-6 shrink-0">
    <div class="space-y-6">
      <!-- Logo & Admin Badge -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-slate-400 text-white rounded-xl flex items-center justify-center font-bold text-lg">M</div>
        <div>
          <h1 class="font-bold text-base text-slate-900 leading-tight">MRBSystem</h1>
          <span class="inline-flex items-center gap-1 text-[10px] font-bold tracking-wider bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full uppercase mt-0.5">
            <i data-lucide="shield" class="w-3 h-3"></i> Admin
          </span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Ana səhifə
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="calendar-check-2" class="w-4 h-4"></i> Rezervasiyalar
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="users" class="w-4 h-4"></i> İstifadəçilər
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="building" class="w-4 h-4"></i> Binalar
        </a>
        <!-- Active Page -->
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-[#6B5CE7] text-white text-sm font-semibold shadow-md shadow-indigo-200">
          <i data-lucide="layers" class="w-4 h-4"></i> Mərtəbələr
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="door-open" class="w-4 h-4"></i> Otaqlar
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="monitor" class="w-4 h-4"></i> Avadanlıq
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
          <i data-lucide="ban" class="w-4 h-4"></i> Bloklamalar
        </a>
      </nav>
    </div>

    <!-- Bottom Actions -->
    <div class="border-t border-slate-100 pt-4 space-y-1">
      <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Tətbiqə qayıt
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">
        <i data-lucide="log-out" class="w-4 h-4"></i> Çıxış
      </a>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 p-8 flex flex-col">

    <!-- TOP HEADER -->
    <header class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Mərtəbələr</h2>
        <p class="text-sm text-slate-500">Bina mərtəbələrini idarə edin.</p>
      </div>

      <div class="flex items-center gap-4">
        <span id="totalFloorBadge" class="text-sm font-semibold text-slate-700">
          Ümumi: 4 Mərtəbə
        </span>
        <button onclick="addFloor()" class="bg-[#6B5CE7] hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2.5 rounded-xl shadow-md transition flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> Mərtəbə Əlavə Et
        </button>
      </div>
    </header>

    <!-- BUILDING SKETCH CONTAINER -->
    <section class="flex-1 flex flex-col items-center justify-center py-6">
      
      <!-- Building Title -->
      <h3 class="text-3xl font-bold text-slate-900 mb-6 tracking-tight">
        Code Academy — Korpus A
      </h3>

      <!-- BINA VİZUAL STRUKTURU -->
      <div class="w-full max-w-lg flex flex-col items-center">

        <!-- 1. ROOF (DAM) -->
        <svg class="w-full h-12 -mb-0.5" viewBox="0 0 400 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 45 L200 10 L390 45" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="0" y1="48" x2="400" y2="48" stroke="black" stroke-width="3"/>
        </svg>

        <!-- 2. FLOORS CONTAINER (MƏRTƏBƏLƏR) -->
        <div id="buildingFloors" class="w-full border-x-3 border-black bg-white flex flex-col divide-y-3 divide-black border-black border-2">
          <!-- Dynamically Rendered Floors -->
        </div>

        <!-- 3. GROUND FLOOR / ENTRANCE (ZƏMİN VƏ QAPI) -->
        <div class="w-full border-2 border-t-0 border-black bg-white p-4 flex justify-center items-end h-24 relative">
          <!-- Double Doors Wireframe -->
          <div class="w-24 h-16 border-2 border-black border-b-0 flex">
            <div class="w-1/2 border-r border-black"></div>
            <div class="w-1/2"></div>
          </div>
        </div>

        <!-- 4. FOUNDATION BASE (BÜNÖVRƏ XƏTTİ) -->
        <div class="w-[106%] h-3 bg-white border-2 border-black rounded-sm mt-0.5 shadow-sm"></div>

      </div>

    </section>

  </main>

  <script>
    // Initial floor data
    let floors = [
      { id: 4, name: "4cü mərtəbə" },
      { id: 3, name: "3cü mərtəbə" },
      { id: 2, name: "2ci mərtəbə" },
      { id: 1, name: "1ci mərtəbə" }
    ];

    function renderBuilding() {
      const container = document.getElementById("buildingFloors");
      document.getElementById("totalFloorBadge").innerText = `Ümumi: ${floors.length} Mərtəbə`;
      container.innerHTML = "";

      floors.forEach(floor => {
        const floorRow = document.createElement("div");
        floorRow.className = "p-4 flex items-center justify-between hover:bg-slate-50 transition";
        
        floorRow.innerHTML = `
          <span class="text-lg font-medium text-slate-900 pl-2">${floor.name}</span>
          <div class="flex items-center gap-2">
            <button onclick="editFloor(${floor.id})" class="p-2 border border-slate-300 rounded-lg hover:bg-slate-100 transition text-slate-700" title="Redaktə et">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button onclick="removeFloor(${floor.id})" class="p-2 border border-slate-300 rounded-lg hover:bg-red-50 hover:text-red-600 transition text-slate-700" title="Sil">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        container.appendChild(floorRow);
      });

      lucide.createIcons();
    }

    function addFloor() {
      const newLevel = floors.length + 1;
      floors.unshift({
        id: Date.now(),
        name: `${newLevel}-ci mərtəbə`
      });
      renderBuilding();
    }

    function editFloor(id) {
      const floor = floors.find(f => f.id === id);
      if(floor) {
        const newName = prompt("Mərtəbə adını dəyişin:", floor.name);
        if(newName && newName.trim() !== "") {
          floor.name = newName.trim();
          renderBuilding();
        }
      }
    }

    function removeFloor(id) {
      if(floors.length <= 1) {
        alert("Binada ən azı 1 mərtəbə qalmalıdır!");
        return;
      }
      floors = floors.filter(f => f.id !== id);
      renderBuilding();
    }

    // Initial load
    renderBuilding();
  </script>
</body>
</html>
